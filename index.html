<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://fav.farm/🚀" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e64c03" />

    <title>Xopy — Lançamento Oficial</title>
    <meta name="description" content="Chegou o Xopy — O futuro da construção civil está no seu bolso! Participe do nosso lançamento oficial."/>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Open Sans', sans-serif;
        margin: 0;
        padding: 0;
      }
      h1, h2, h3, h4, h5, h6, button, nav {
        font-family: 'Poppins', sans-serif;
      }
      @keyframes fade-in {
        from {
          transform: translateY(20px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .animate-fade-in {
        animation: fade-in 0.8s ease-out forwards;
      }
      .bg-grid-orange {
        background-image: linear-gradient(rgba(232, 123, 58, 0.1) 1px, transparent 1px), linear-gradient(to right, rgba(232, 123, 58, 0.1) 1px, transparent 1px);
        background-size: 3rem 3rem;
      }
    </style>
  </head>
  <body class="bg-[#020000]">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
