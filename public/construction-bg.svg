<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(232, 123, 58, 0.15)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="#020000"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  
  <!-- Construction elements -->
  <g opacity="0.1" fill="none" stroke="#e87b3a" stroke-width="3">
    <!-- Building outline -->
    <rect x="200" y="400" width="300" height="500" stroke-width="4"/>
    <line x1="200" y1="500" x2="500" y2="500"/>
    <line x1="200" y1="600" x2="500" y2="600"/>
    <line x1="200" y1="700" x2="500" y2="700"/>
    <line x1="200" y1="800" x2="500" y2="800"/>
    <line x1="300" y1="400" x2="300" y2="900"/>
    <line x1="400" y1="400" x2="400" y2="900"/>
    
    <!-- Crane -->
    <line x1="1400" y1="200" x2="1400" y2="800" stroke-width="5"/>
    <line x1="1400" y1="200" x2="1700" y2="200" stroke-width="4"/>
    <line x1="1100" y1="200" x2="1400" y2="200" stroke-width="4"/>
    <line x1="1650" y1="200" x2="1650" y2="400"/>
    
    <!-- Tools -->
    <circle cx="800" cy="300" r="60"/>
    <line x1="770" y1="270" x2="830" y2="330"/>
    <line x1="770" y1="330" x2="830" y2="270"/>
    
    <!-- Helmet -->
    <path d="M 1000 600 Q 1000 550 1050 550 Q 1100 550 1100 600 L 1090 620 L 1010 620 Z"/>
    <line x1="1010" y1="620" x2="1090" y2="620" stroke-width="4"/>
  </g>
  
  <!-- Subtle texture overlay -->
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.05"/>
</svg>
